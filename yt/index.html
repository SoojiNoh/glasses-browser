<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안경 유튜브</title>
<style>
  :root { --accent: #D97757; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  body { width: 600px; max-width: 100vw; min-height: 600px; padding: 14px; font-size: 22px; line-height: 1.35; }
  button { background: #222; color: #fff; border: 2px solid #444; border-radius: 12px; font-size: 22px; padding: 6px 10px; cursor: pointer; }
  :focus { outline: 4px solid var(--accent); outline-offset: 2px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font-size: 22px; padding: 8px; border-radius: 12px; border: 2px solid #555; background: #111; color: #fff; }
  .v { display: flex; gap: 10px; width: 100%; text-align: left; margin: 6px 0; padding: 6px; align-items: center; }
  .v img { width: 160px; height: 90px; object-fit: cover; border-radius: 8px; flex: none; }
  .v small { display: block; color: #aaa; font-size: 16px; }
  .ctl { display: flex; gap: 6px; margin-top: 8px; } .ctl button { flex: 1; padding: 6px 0; }
  #msg { color: #ffb36b; font-size: 18px; min-height: 1em; margin: 6px 0; }
  #pl { width: 572px; max-width: 100%; aspect-ratio: 16/9; background: #111; }
</style>
</head>
<body>
<div id="list">
  <form id="f"><input id="q" type="search" placeholder="유튜브 검색 (손글씨·받아쓰기·폰 자판)"><button>🔎</button></form>
  <div id="msg" role="status"></div>
  <div id="res"></div>
</div>
<div id="watch" hidden>
  <div id="pl"></div>
  <div class="ctl">
    <button id="back">← 목록</button><button id="rw">◀ 10</button><button id="pp">⏯</button><button id="ff">10 ▶</button>
  </div>
  <div class="ctl">
    <button id="cc">자막</button><button id="vd">🔉</button><button id="vu">🔊</button>
  </div>
  <div id="wmsg" style="color:#ffb36b;font-size:18px;min-height:1em;margin-top:6px"></div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ponytail: 검색은 r.jina.ai 로 유튜브 검색 화면을 읽어 링크만 뽑음(키 없음). 막히면 YouTube Data API 로 교체.
const $ = id => document.getElementById(id), RELAY = 'https://ntfy.sh/';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const say = t => $('msg').textContent = t, wsay = t => $('wmsg').textContent = t;
let player, ready = false, pending = null, cc = false;

function ytId(s) { const m = String(s).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/); return m && m[1]; }
async function search(q) {
  const id = ytId(q); if (id) return play(id);
  say('찾는 중…'); put('yt.q', q);
  try {
    const r = await fetch('https://r.jina.ai/https://www.youtube.com/results?search_query=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('검색 서버 ' + r.status);
    const md = await r.text(), seen = new Map();
    for (const m of md.matchAll(/\[([^\]]{3,140})\]\(https:\/\/www\.youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})[^)]*\)/g)) {
      const [, raw, id] = m, d = raw.match(/ · (\d+:\d{2}(?::\d{2})?)$/);
      const cur = seen.get(id) || { id, t: raw.replace(/ · \d+:\d{2}(?::\d{2})?$/, ''), d: '' };
      if (d) cur.d = d[1];
      seen.set(id, cur);
    }
    const list = [...seen.values()].slice(0, 15);
    put('yt.last', list); draw(list);
    say(list.length ? '' : '결과 없음');
  } catch (e) { say('⚠ 검색 실패: ' + e.message); }
}
function draw(list) {
  $('res').innerHTML = list.map(v => `<button class="v" data-id="${v.id}"><img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><span>${esc(v.t)}<small>${v.d || ''}</small></span></button>`).join('');
  const b = $('res').querySelector('button'); if (b) b.focus();
}
$('res').onclick = e => { const b = e.target.closest('[data-id]'); if (b) play(b.dataset.id); };
$('f').onsubmit = e => { e.preventDefault(); if ($('q').value.trim()) search($('q').value.trim()); };

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('pl', { width: 572, height: 322, playerVars: { playsinline: 1, rel: 0, hl: 'ko', cc_lang_pref: 'ko' },
    events: { onReady: () => { ready = true; if (pending) play(pending); },
      onError: e => wsay([101, 150, 153].includes(e.data) ? '이 영상은 안경에서 재생 불가(퍼가기 막힘) — ← 목록에서 다른 영상을 고르세요.' : '재생 오류 ' + e.data),
      onStateChange: e => { if (e.data === 1) wsay(''); } } });
};
function play(id) {
  $('list').hidden = true; $('watch').hidden = false; $('pp').focus();
  if (!ready) { pending = id; return wsay('플레이어 준비 중…'); }
  pending = null; wsay(''); player.loadVideoById(id);
  history.pushState({ v: id }, '', '#v=' + id);
}
function toList() { try { player.pauseVideo(); } catch {} $('watch').hidden = true; $('list').hidden = false; const b = $('res').querySelector('button') || $('q'); b.focus(); }
const seek = d => player.seekTo(Math.max(0, player.getCurrentTime() + d), true);
$('back').onclick = () => history.state && history.state.v ? history.back() : toList();
$('rw').onclick = () => seek(-10); $('ff').onclick = () => seek(10);
$('pp').onclick = () => player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
$('cc').onclick = () => { cc = !cc; if (cc) { player.loadModule('captions'); player.setOption('captions', 'track', { languageCode: 'ko' }); } else player.unloadModule('captions'); wsay(cc ? '자막 켬' : '자막 끔'); };
const vol = d => { player.unMute(); const v = Math.max(0, Math.min(100, player.getVolume() + d)); player.setVolume(v); wsay('음량 ' + v); };
$('vd').onclick = () => vol(-10); $('vu').onclick = () => vol(10);
// 재생 화면: 밴드 좌우 = 10초
addEventListener('keydown', e => { if (!$('watch').hidden && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && document.activeElement && document.activeElement.parentElement.className === 'ctl' && document.activeElement.id === 'pp') { e.preventDefault(); seek(e.key === 'ArrowLeft' ? -10 : 10); } }, true);
addEventListener('popstate', e => { if (e.state && e.state.v) play(e.state.v); else toList(); });
// 폰 자판: 글자 → 검색칸, 보내기 → 검색(유튜브 링크면 바로 재생)
const code = get('gb.code', null);
if (code) {
  const pe = new EventSource(RELAY + 'gb-' + code + '/sse');
  pe.onmessage = ev => {
    let m; try { m = JSON.parse(JSON.parse(ev.data).message); } catch { return; }
    if (m.t === 'text') $('q').value = m.v;
    else if (m.t === 'go' && m.v.trim()) { $('q').value = m.v; search(m.v.trim()); }
  };
}
$('q').value = get('yt.q', '');
draw(get('yt.last', []));
const start = ytId(location.hash); if (start) play(start);
</script>
</body>
</html>
