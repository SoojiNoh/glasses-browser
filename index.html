<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="application-name" content="안경 앱 모음">
<title>안경 앱 모음</title>
<script>
  // 옛 브라우저 주소(/#{...})로 들어오면 브라우저로 넘김 — 예전에 저장된 링크가 깨지지 않게
  if (location.hash.startsWith('#%7B') || location.hash.startsWith('#{')) location.replace('browser/' + location.hash);
</script>
<style>
  :root { --accent: #D97757; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  body { width: 600px; max-width: 100vw; min-height: 600px; padding: 14px; }
  h1 { font-size: 22px; color: var(--accent); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  a { display: block; text-decoration: none; color: #fff; background: #1a1a1a; border: 2px solid #444; border-radius: 14px; padding: 10px 12px; cursor: pointer; min-height: 92px; }
  a b { display: block; font-size: 24px; }
  a small { display: block; color: #aaa; font-size: 15px; line-height: 1.3; margin-top: 4px; }
  a:focus { outline: 4px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<h1>안경 앱 모음</h1>
<div class="grid">
  <a href="browser/"><b>🌐 브라우저</b><small>검색·읽기 모드·즐겨찾기·자판</small></a>
  <a href="yt/"><b>📺 유튜브</b><small>검색·재생·10초 이동·자막</small></a>
  <a href="book/"><b>📚 책장</b><small>ePub·PDF·TXT 이북 읽기</small></a>
  <a href="rl/"><b>📝 RL 노트</b><small>강의 63개·슬라이드·자막</small></a>
  <a href="gdrive/"><b>📁 드라이브·클래스룸</b><small>최근 파일·과제·공지 제목</small></a>
  <a href="ai/"><b>🤖 AI</b><small>Claude·GPT에게 묻기</small></a>
  <a href="type.html"><b>⌨ 휴대폰 입력</b><small>휴대폰에서 여는 자판 페이지</small></a>
</div>
<script>
  // 뉴럴 밴드 ←→↑↓ 로 2열 격자 이동, Enter = 열기(브라우저 기본)
  const cards = [...document.querySelectorAll('.grid a')];
  let last = 0; try { last = +localStorage.getItem('hub.last') || 0; } catch {}
  cards.forEach((a, i) => a.addEventListener('click', () => { try { localStorage.setItem('hub.last', i); } catch {} }));
  addEventListener('keydown', e => {
    const i = cards.indexOf(document.activeElement); if (i < 0) return;
    const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -2, ArrowDown: 2 }[e.key]; if (d == null) return;
    const j = i + d; if (j >= 0 && j < cards.length) { e.preventDefault(); cards[j].focus(); }
  }, true);
  (cards[last] || cards[0]).focus();
</script>
</body>
</html>
