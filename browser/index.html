<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안경 브라우저</title>
<style>
  :root { --fs: 26px; --accent: #D97757; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  body { width: 600px; max-width: 100vw; min-height: 600px; padding: 14px; font-size: var(--fs); line-height: 1.45; }
  #bar { display: flex; gap: 8px; position: sticky; top: 0; background: #000; padding-bottom: 8px; z-index: 2; }
  button, a { cursor: pointer; }
  button { background: #222; color: #fff; border: 2px solid #444; border-radius: 12px; font-size: 22px; padding: 6px 12px; }
  :focus { outline: 4px solid var(--accent); outline-offset: 2px; }
  #q { width: 100%; font-size: 26px; padding: 10px; border-radius: 12px; border: 2px solid #555; background: #111; color: #fff; }
  h1, h2, h3 { font-size: 1.15em; margin: .6em 0 .3em; color: var(--accent); }
  p, li, .blk { margin: .35em 0; }
  a { color: #8cc8ff; }
  .res { display: block; padding: 8px 10px; margin: 8px 0; border: 2px solid #333; border-radius: 12px; text-decoration: none; }
  .res small { display: block; color: #aaa; font-size: .65em; word-break: break-all; }
  #msg { color: #ffb36b; font-size: 20px; min-height: 1em; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .res { flex: 1; }
  #pad { margin: 6px 0; }
  #pad .k { display: flex; gap: 4px; margin: 4px 0; }
  #pad .k button { flex: 1; padding: 6px 0; font-size: 22px; min-width: 0; }
  .sites { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  #code { font-size: 44px; letter-spacing: 6px; color: var(--accent); }
  #qr img { background: #fff; padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<div id="bar">
  <button id="back" aria-label="뒤로">←</button>
  <button id="home" aria-label="처음">🏠</button>
  <button id="star" aria-label="즐겨찾기">☆</button>
  <button id="smaller" aria-label="글자 작게">A−</button>
  <button id="bigger" aria-label="글자 크게">A+</button>
  <button id="kb" aria-label="자판">자판</button>
  <button id="phone" aria-label="폰 자판 연결">폰</button>
</div>
<div id="pad" hidden></div>
<div id="msg" role="status"></div>
<main id="view"></main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// ponytail: 페이지 읽기·검색은 r.jina.ai(무료·키 없음, 분당 요청 수 제한) 경유. 막히면 Cloudflare Worker 로 교체.
const READER = 'https://r.jina.ai/';
const SEARCH = q => 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q);
const $ = id => document.getElementById(id);
const view = $('view'), msg = $('msg');

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) {
    try {
      const old = localStorage.getItem(k);
      if (old) localStorage.setItem(k + '.bak', old);   // 직전 값 보관
      localStorage.setItem(k, JSON.stringify(v));
    } catch (e) { say('저장 실패: ' + e.message); }
  }
};
let favs = store.get('gb.favs', []);
let fs = store.get('gb.fs', 26);
const applyFs = () => document.documentElement.style.setProperty('--fs', fs + 'px');
applyFs();

function say(t) { msg.textContent = t || ''; }
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function realUrl(u) {           // DDG 이동 링크 → 원래 주소
  try { const x = new URL(u, 'https://duckduckgo.com'); const g = x.searchParams.get('uddg'); return g || u; } catch { return u; }
}
function isAd(u) { return /y\.js\?ad_domain|ad_provider=/.test(u); }

async function fetchMd(url) {
  say('불러오는 중…');
  url = url.replace(/^https?:\/\/blog\.naver\.com\//, 'https://m.blog.naver.com/');  // PC 블로그는 본문이 iframe 안
  const r = await fetch(READER + url, { headers: { 'X-Retain-Images': 'none' } });
  if (!r.ok) throw new Error('읽기 서버 ' + r.status + (r.status === 429 ? ' (요청이 많음 — 잠시 뒤 다시)' : ''));
  return r.text();
}

function inline(s) {
  s = esc(s).replace(/!\[[^\]]*\]\([^)]*\)/g, '');
  return s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g,
    (m, t, u) => isAd(u) ? '' : `<a href="#" data-u="${esc(realUrl(u.replace(/&amp;/g, '&')))}">${t}</a>`);
}

function mdToHtml(md) {
  const body = md.split('Markdown Content:').pop();
  const out = [];
  for (let line of body.split('\n')) {
    line = line.trim();
    if (!line || /^\[\]\(/.test(line) || /^[-=*_]{3,}$/.test(line)) continue;
    const h = line.match(/^(#{1,6})\s+(.*)/);
    const html = inline(h ? h[2] : line.replace(/^[-*+]\s+/, '• '));
    if (!html.replace(/<[^>]+>/g, '').trim()) continue;
    out.push(h ? `<h2 tabindex="0">${html}</h2>` : `<p class="blk" tabindex="0">${html}</p>`);
  }
  return out.join('') || '<p>읽을 글이 없습니다.</p>';
}

function searchHtml(md) {
  const out = [];
  for (const m of md.matchAll(/^##\s+\[([^\]]+)\]\(([^)\s]+)\)/gm)) {
    if (isAd(m[2])) continue;
    const u = realUrl(m[2]);
    out.push(`<a class="res" href="#" data-u="${esc(u)}">${esc(m[1])}<small>${esc(u)}</small></a>`);
  }
  return out.join('') || '<p>검색 결과가 없습니다.</p>';
}

function toTarget(input) {
  input = input.trim();
  if (/^https?:\/\//i.test(input)) return { kind: 'page', u: input };
  if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(input)) return { kind: 'page', u: 'https://' + input };
  return { kind: 'search', q: input };
}

let current = null;
async function show(state, push = true) {
  if (push) history.pushState(state, '', '#' + encodeURIComponent(JSON.stringify(state)));
  current = state;
  $('star').textContent = state.kind === 'page' && favs.some(f => f.u === state.u) ? '★' : '☆';
  if (state.kind !== 'page' && state.kind !== 'search') return renderHome();
  try {
    if (state.kind === 'search') {
      recent = [state.q, ...recent.filter(r => r !== state.q)].slice(0, 8); store.set('gb.recent', recent);
      view.innerHTML = `<h2>🔎 ${esc(state.q)}</h2>` + searchHtml(await fetchMd(SEARCH(state.q)));
    } else {
      const md = await fetchMd(state.u);
      const title = (md.match(/^Title:\s*(.*)$/m) || [, state.u])[1];
      state.t = title;
      view.innerHTML = `<h1 tabindex="0">${esc(title)}</h1>` + mdToHtml(md);
    }
    say('');
    window.scrollTo(0, 0);
    (view.querySelector('a, [tabindex]') || $('back')).focus();
  } catch (e) {
    say('⚠ ' + e.message);
    view.innerHTML = '<p>열지 못했습니다. ← 로 돌아가거나 다시 시도하세요.</p>';
  }
}

function renderHome() {
  view.innerHTML = `
    <label for="q">주소 또는 검색어</label>
    <form id="f"><input id="q" type="search" enterkeyhint="go" autocomplete="off"></form>
    <div class="sites">${recent.slice(0, 4).map(r => `<button data-q="${esc(r)}">🕘 ${esc(r)}</button>`).join('')}${SITES.map(s => `<button data-u="${s[1]}">${s[0]}</button>`).join('')}</div>
    <h2>즐겨찾기</h2>
    ${favs.length ? favs.map((f, i) => `<div class="row"><a class="res" href="#" data-u="${esc(f.u)}">${esc(f.t || f.u)}<small>${esc(f.u)}</small></a><button data-del="${i}" aria-label="지우기">✕</button></div>`).join('') : '<p>아직 없습니다. 페이지에서 ☆ 를 누르세요.</p>'}`;
  $('f').onsubmit = e => { e.preventDefault(); const v = $('q').value; if (v.trim()) show(toTarget(v)); };
  $('q').focus();
}

view.addEventListener('click', e => {
  const a = e.target.closest('[data-u]');
  if (a) { e.preventDefault(); return show({ kind: 'page', u: a.dataset.u }); }
  const rq = e.target.closest('[data-q]');
  if (rq) return show({ kind: 'search', q: rq.dataset.q });
  const d = e.target.closest('[data-del]');
  if (d) { favs.splice(+d.dataset.del, 1); store.set('gb.favs', favs); renderHome(); }
});
$('back').onclick = () => history.length > 1 ? history.back() : show({ kind: 'home' });
$('home').onclick = () => show({ kind: 'home' });
$('star').onclick = () => {
  if (!current || current.kind !== 'page') return say('페이지에서만 즐겨찾기를 할 수 있습니다.');
  const i = favs.findIndex(f => f.u === current.u);
  if (i >= 0) favs.splice(i, 1); else favs.unshift({ u: current.u, t: current.t });
  store.set('gb.favs', favs);
  $('star').textContent = i >= 0 ? '☆' : '★';
  say(i >= 0 ? '즐겨찾기에서 뺐습니다.' : '즐겨찾기에 넣었습니다.');
};
$('bigger').onclick = () => { fs = Math.min(44, fs + 2); applyFs(); store.set('gb.fs', fs); };
$('smaller').onclick = () => { fs = Math.max(18, fs - 2); applyFs(); store.set('gb.fs', fs); };
addEventListener('popstate', e => show(e.state || { kind: 'home' }, false));

// ── 안경 자판(영문·숫자). 한글은 📱 폰 자판으로. ──
const SITES = [['네이버 뉴스', 'https://m.news.naver.com/'], ['위키백과', 'https://ko.m.wikipedia.org/'], ['나무위키', 'https://namu.wiki/']];
const ROWS = ['1234567890', 'qwertyuiop', 'asdfghjkl-', 'zxcvbnm./'];
// 천지인: 모음 3키(ㅣ ㆍ ㅡ) + 자음 묶음 키(같은 키 반복 = 다음 자음). → = 같은 키 자음을 새로 시작
const KO = [['ㅣ', 'ㆍ', 'ㅡ', '⌫'], ['ㄱㅋ', 'ㄴㄹ', 'ㄷㅌ', ' '], ['ㅂㅍ', 'ㅅㅎ', 'ㅈㅊ', '→'], ['한/영', 'ㅇㅁ', '.', '⏎']];
const GROUPS = { 'ㄱㅋ': 'ㄱㅋㄲ', 'ㄴㄹ': 'ㄴㄹ', 'ㄷㅌ': 'ㄷㅌㄸ', 'ㅂㅍ': 'ㅂㅍㅃ', 'ㅅㅎ': 'ㅅㅎㅆ', 'ㅈㅊ': 'ㅈㅊㅉ', 'ㅇㅁ': 'ㅇㅁ' };
const VCOMB = { 'ㆍㆍ': 'ᆢ', 'ㅣㆍ': 'ㅏ', 'ㅏㆍ': 'ㅑ', 'ㆍㅣ': 'ㅓ', 'ᆢㅣ': 'ㅕ', 'ㆍㅡ': 'ㅗ', 'ᆢㅡ': 'ㅛ', 'ㅡㆍ': 'ㅜ', 'ㅜㆍ': 'ㅠ', 'ㅡㅣ': 'ㅢ',
  'ㅏㅣ': 'ㅐ', 'ㅓㅣ': 'ㅔ', 'ㅑㅣ': 'ㅒ', 'ㅕㅣ': 'ㅖ', 'ㅗㅣ': 'ㅚ', 'ㅚㆍ': 'ㅘ', 'ㅘㅣ': 'ㅙ', 'ㅜㅣ': 'ㅟ', 'ㅠㅣ': 'ㅝ', 'ㅝㅣ': 'ㅞ' };
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const JJ = { 'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ', 'ㄹㄱ': 'ㄺ', 'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ', 'ㄹㅌ': 'ㄾ', 'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ' };
const isV = c => c && (JUNG.includes(c) || c === 'ㆍ' || c === 'ᆢ');
const isC = c => c && CHO.includes(c);
function compose(js) {           // 자모 목록 → 완성형 한글
  js = js.filter(Boolean); let out = '';
  for (let i = 0; i < js.length;) {
    const c = js[i], v = js[i + 1];
    if (isC(c) && v && JUNG.includes(v)) {
      let jong = '', n = 2; const a = js[i + 2], b = js[i + 3];
      if (isC(a) && !isV(b)) {
        if (isC(b) && JJ[a + b] && !isV(js[i + 4])) { jong = JJ[a + b]; n = 4; }
        else if (JONG.includes(a)) { jong = a; n = 3; }
      }
      out += String.fromCharCode(0xAC00 + (CHO.indexOf(c) * 21 + JUNG.indexOf(v)) * 28 + JONG.indexOf(jong));
      i += n;
    } else { out += c; i++; }
  }
  return out;
}
const pad = $('pad');
let mode = 'ko', base = '', jamo = [], undo = [];
function q() { if (!$('q')) show({ kind: 'home' }); return $('q'); }
function drawPad() {
  const rows = mode === 'ko' ? KO : [...ROWS.map(r => [...r]), ['한/영', ' ', '.com', '⌫', '⏎']];
  const label = k => ({ ' ': '띄우기', '→': '다음→', '⏎': '확인' }[k] || k);
  pad.innerHTML = rows.map(r => `<div class="k">${r.map(c => `<button data-k="${c}">${label(c)}</button>`).join('')}</div>`).join('') + '<div id="sug"></div>';
}
function commit() { base += compose(jamo); jamo = []; undo = []; }
function render() { const el = q(); el.value = base + compose(jamo); say('입력: ' + el.value); suggest(el.value); }
function keyKo(k) {
  undo.push(jamo.slice());
  const last = jamo[jamo.length - 1];
  if ('ㅣㆍㅡ'.includes(k)) {
    const c = isV(last) && VCOMB[last + k];
    if (c) jamo[jamo.length - 1] = c; else jamo.push(k);
  } else if (GROUPS[k]) {
    const g = GROUPS[k], at = last ? g.indexOf(last) : -1;
    if (at >= 0) jamo[jamo.length - 1] = g[(at + 1) % g.length]; else jamo.push(g[0]);
  } else if (k === '→') jamo.push(null);
}
pad.addEventListener('click', e => {
  const k = e.target.dataset.k; if (k == null) return;
  const el = q();
  if (e.target.dataset.s != null) { pad.hidden = true; return show(toTarget(e.target.dataset.s)); }
  if (k === '⌫') { if (jamo.length) jamo = undo.pop() || jamo.slice(0, -1); else base = base.slice(0, -1); }
  else if (k === '⏎') { commit(); pad.hidden = true; if (el.value.trim()) show(toTarget(el.value)); return; }
  else if (k === '한/영') { commit(); mode = mode === 'ko' ? 'en' : 'ko'; drawPad(); pad.querySelector('button').focus(); }
  else if (mode === 'ko' && k !== ' ' && k !== '.') keyKo(k);
  else { commit(); base += k; }
  render();
});
// 검색어 후보: 최근 검색 + 한국어 위키백과 제목(무료·키 없음)
let recent = store.get('gb.recent', []), sugT;
function suggest(t) {
  clearTimeout(sugT);
  const box = $('sug'); if (!box || !t.trim()) { if (box) box.innerHTML = ''; return; }
  sugT = setTimeout(async () => {
    let list = recent.filter(r => r.includes(t));
    try {
      const r = await fetch('https://ko.wikipedia.org/w/api.php?action=opensearch&limit=5&origin=*&search=' + encodeURIComponent(t));
      list = list.concat((await r.json())[1]);
    } catch {}
    list = [...new Set(list)].slice(0, 5);
    box.innerHTML = list.map(s => `<button class="res" data-k="" data-s="${esc(s)}">🔎 ${esc(s)}</button>`).join('');
  }, 350);
}
$('kb').onclick = () => { pad.hidden = !pad.hidden; if (!pad.hidden) { base = q().value; jamo = []; drawPad(); pad.querySelector('button').focus(); } };

// ── 📱 폰 자판 연결: ntfy.sh 공개 중계(무료·키 없음). 주제 이름 = 8자리 비밀 코드 ──
// ponytail: 코드를 아는 사람은 글을 넣을 수 있음(읽기만 해당 화면). 더 막으려면 메시지 서명 추가.
const RELAY = 'https://ntfy.sh/';
let code = store.get('gb.code', null);
if (!code) { code = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join(''); store.set('gb.code', code); }
let es;
function listen() {
  if (es) return;
  es = new EventSource(RELAY + 'gb-' + code + '/sse');
  es.onmessage = ev => {
    let m; try { m = JSON.parse(JSON.parse(ev.data).message); } catch { return; }
    if (m.t === 'text') { const el = q(); el.value = m.v; say('📱 ' + m.v); }
    else if (m.t === 'go' && m.v.trim()) show(toTarget(m.v));
    else if (m.t === 'back') $('back').click();
    else if (m.t === 'home') show({ kind: 'home' });
  };
  es.onerror = () => say('📱 연결 끊김 — 다시 잇는 중…');
  es.onopen = () => say('📱 폰 자판 연결됨');
}
listen();
$('phone').onclick = () => {
  const link = new URL('../type.html', location.href).href + '#' + code;
  history.pushState({ kind: 'pair' }, '', '#pair'); current = { kind: 'pair' };
  view.innerHTML = `<h2>📱 폰 자판 연결</h2><p>폰 카메라로 찍거나, 폰에서 <b>soojinoh.github.io/glasses-browser/type.html</b> 을 열고 코드를 넣으세요.</p>
    <div id="code" tabindex="0">${code.slice(0, 4)} ${code.slice(4)}</div><div id="qr"></div>`;
  try { const g = qrcode(0, 'M'); g.addData(link); g.make(); $('qr').innerHTML = g.createImgTag(5); } catch { $('qr').textContent = '(QR 그리기 실패 — 코드를 입력하세요)'; }
};

let start = { kind: 'home' };
try { if (location.hash) start = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch {}
history.replaceState(start, '', location.hash || '#');
show(start, false);
</script>
<script src="../hold.js"></script>
</body>
</html>
